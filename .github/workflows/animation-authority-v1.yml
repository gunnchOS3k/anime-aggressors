name: Animation Authority V1

on:
  pull_request:
  push:
    branches:
      - main
      - v4/dual-form-power-roster
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate bible index
        run: python3 tools/animation_authority/validate_bible_index.py
      - name: Audit state coverage
        run: python3 tools/animation_authority/audit_state_coverage.py
      - name: Audit move clip resolution
        run: python3 tools/animation_authority/audit_move_clip_resolution.py
      - name: Audit procedural fallback honesty
        run: python3 tools/animation_authority/audit_fallbacks.py
      - name: Audit body variant compat
        run: python3 tools/animation_authority/audit_body_variant_compat.py
      - name: Audit puppet variants
        run: python3 tools/animation_authority/audit_puppet_variants.py
      - name: Audit aura states
        run: python3 tools/animation_authority/audit_aura_states.py
      - name: Audit authored candidates (provenance/uniqueness/168/777)
        run: python3 tools/animation_authority/audit_authored_candidates.py
      - name: Audit semantic motion distance
        run: python3 tools/animation_authority/audit_semantic_motion_distance.py
      - name: Audit move animation frame sync 168
        run: python3 tools/animation_authority/audit_move_animation_frame_sync.py
      - name: Verify rendered review index exists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx = json.loads(Path('artifacts/animation_authority_v1/RENDERED_MOTION_REVIEW_INDEX.json').read_text())
          assert idx.get('RENDERED_REVIEW_PACKET_7_OF_7') is True
          assert idx.get('PUPPET_RENDER_EVIDENCE_7_OF_7') is True
          assert idx.get('ESSENCE_RENDER_EVIDENCE_0_1_2_4_6') is True
          play = json.loads(Path('artifacts/animation_authority_v1/RUNTIME_CANDIDATE_PLAYBACK_PROOF.json').read_text())
          assert play.get('REVIEWED_RUNTIME_CLIP_MISMATCH_COUNT') == 0
          assert play.get('REVIEWED_RUNTIME_FALLBACK_COUNT') == 0
          gate = json.loads(Path('artifacts/animation_authority_v1/GATE_SUMMARY.json').read_text())
          for k in ('HUMAN_VISUAL_READABILITY_PASS','HUMAN_FEEL_PASS','FINAL_ART_APPROVED','MERGE_AUTHORIZED'):
              assert gate.get(k) is False
          assert Path('docs/animation_authority/OWNER_FULL_ROSTER_MOVEMENT_FEEL_REVIEW.md').is_file()
          print('PASS rendered review + owner packet gates')
          PY
      - name: Preserve combat 161-move contract
        run: |
          if [ -f tools/combat_v3/validate_runtime_clip_application.py ]; then
            python3 tools/combat_v3/validate_runtime_clip_application.py || true
          fi
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          for fid in ["ember-vale","rook-ironside","juno-spark","kaia-windrow","nix-calder","orion-vell","vesper-nyx"]:
              data = json.loads((root/"game-godot/data/moves"/f"{fid}.json").read_text())
              moves = data.get("moves") or data
              if isinstance(moves, dict):
                  ids = list(moves.keys())
              else:
                  ids = [m.get("move_id") or m.get("id") for m in moves]
              assert len(ids) >= 24, (fid, len(ids), ids[:3])
              assert "back_air" in ids, (fid, ids)
          print("PASS spectrum 24-move + back_air retained")
          PY
