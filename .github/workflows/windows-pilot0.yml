name: Windows Pilot 0

# Authentic Windows evidence for Anime Aggressors via Godot Web in Windows browser.
# Unity = BLOCKED_ENGINE_LICENSE. Pixel acceptance stays PENDING_DEVICE.

on:
  pull_request:
  push:
    branches: [main, "cursor/windows-pilot0-authentic-evidence*"]
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Soak seconds (>=1800 for PASS)"
        required: false
        default: "1800"

jobs:
  windows-pilot0-windows-2025:
    name: windows-pilot0-windows-2025
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
      - name: Record runner metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/windows_pilot0 | Out-Null
          @{ ImageOS = $env:ImageOS; ImageVersion = $env:ImageVersion; GITHUB_SHA = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content reports/windows_pilot0/RUNNER_META.json
      - name: Windows Pilot 0 evidence
        shell: pwsh
        env:
          WINDOWS_PILOT0_SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '1800' }}
          GODOT_BIN: godot
        run: python scripts/windows_pilot0_evidence.py
      - name: Short SHA
        id: meta
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: anime-windows-pilot0-${{ steps.meta.outputs.short_sha }}
          path: |
            builds/web/**
            reports/windows_pilot0/**
          retention-days: 14
          if-no-files-found: error

  windows-pilot0-windows-latest:
    name: windows-pilot0-windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compat note only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/windows_pilot0 | Out-Null
          @{ role = "compatibility_smoke_not_authoritative"; ImageOS = $env:ImageOS; ImageVersion = $env:ImageVersion } |
            ConvertTo-Json | Set-Content reports/windows_pilot0/WINDOWS_LATEST_COMPAT.json
      - uses: actions/upload-artifact@v4
        with:
          name: anime-windows-pilot0-latest-compat-${{ github.sha }}
          path: reports/windows_pilot0/WINDOWS_LATEST_COMPAT.json
