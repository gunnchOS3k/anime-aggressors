name: Engineering Wave014 Anime Procedural Roster Runtime

on:
  push:
    branches: [main, "eng/wave014-anime-procedural-roster-runtime", "eng/**"]
  pull_request:
    branches: [main]

jobs:
  wave014:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Godot 4.5
        run: |
          set -euo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.5-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Blender (best effort)
        run: |
          sudo apt-get update
          sudo apt-get install -y blender || true

      - name: Run Engineering Wave014
        env:
          GODOT_BIN: ${{ env.GODOT_BIN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTIONS: "true"
        run: make engineering-wave014

      - name: Upload Wave014 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-wave014-evidence
          path: |
            artifacts/wave014/
            artifacts/engineering_wave014/

      - name: CI final gate — truthful PASS/PARTIAL
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("artifacts/engineering_wave014/WAVE014_RESULT.json"))
          assert d.get("CURSOR_MERGED_NOTHING") is True
          assert int(d.get("COMPUTED_CORE_PIPELINE_MONETARY_COST_USD", 1)) == 0
          assert d.get("ZERO_COST_CHECK_PASS") is True
          assert d.get("PROCEDURAL_CHARACTER_RUNTIME_PASS") is True
          assert d.get("PROCEDURAL_RUNTIME_ANIMATION_PASS") is True
          assert d.get("FINAL_CHARACTER_ART_PASS") is False
          assert d.get("FINAL_HUMAN_AUTHORED_ANIMATION_PASS") is False
          assert d.get("HUMAN_ART_DIRECTION_APPROVAL") is False
          assert d.get("REAL_USER_MOTION_LIBRARY_PRESENT") is False
          assert d.get("EDMUND_PERSONAL_MOTION_USED") is False
          assert int(d.get("NEW_S0", 1)) == 0
          assert int(d.get("NEW_S1", 1)) == 0
          assert int(d.get("TOTAL_PROCEDURAL_CLIPS", 0)) >= 315
          assert int(d.get("SIGNATURE_PROCEDURAL_CLIPS", 0)) >= 56
          assert d.get("COMPETITIVE_GAMEPLAY_ROOT_MOTION") == "PHYSICS_AUTHORITATIVE"
          assert d.get("PIPELINE_IMPLEMENTATION_PASS") is True
          assert d.get("ENGINEERING_WAVE_014") in ("PASS", "PARTIAL")
          assert d.get("token") == "ENGINEERING_WAVE_014_PROCEDURAL_ROSTER_RUNTIME_PASS"
          print("CI final gate OK", d.get("ENGINEERING_WAVE_014"), d.get("token"))
          PY
